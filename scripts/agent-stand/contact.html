<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Acme — contact us</title><style>body{font:15px system-ui;margin:24px;max-width:600px}label{display:block;margin:10px 0}input,select,textarea{display:block;width:100%;padding:8px;margin-top:4px}</style></head><body>
<h1>Contact support</h1>
<form id="f" action="/log" method="post">
<label>Full name <input name="name" required></label>
<label>Email <input name="email" type="email" required></label>
<label for="phone">Phone (optional)</label><input id="phone" name="phone" type="tel" placeholder="+1 555 0100">
<label>Topic <select name="topic" required><option value="">Choose…</option><option value="billing">Billing</option><option value="tech">Technical problem</option><option value="other">Something else</option></select></label>
<fieldset><legend>Preferred contact</legend><label><input type="radio" name="pref" value="email" style="display:inline;width:auto"> Email</label><label><input type="radio" name="pref" value="phone" style="display:inline;width:auto"> Phone</label></fieldset>
<label>Message <textarea name="message" rows="4" required></textarea></label>
<label><input type="checkbox" name="consent" required style="display:inline;width:auto"> I agree to the privacy policy</label>
<button>Send message</button>
</form>
<script>document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));fetch('/log',{method:'POST',body:JSON.stringify({task:'contact',...d})}).then(()=>{document.body.innerHTML='<h1>Thanks — we got your message</h1>'});});</script>
</body></html>
